name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Build with placeholder env so a broken build is caught here rather than
      # on the deploy that the reviewer is going to open.
      - name: Build
        run: npm run build
        env:
          MONGODB_URI: mongodb://localhost:27017/ci
          JWT_SECRET: ci-only-secret-value-that-is-long-enough-32
          NEXT_PUBLIC_API_URL: http://localhost:4000/api
